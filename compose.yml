services:
  quota-service:
    container_name: quota-service
#    image: hyperf/hyperf:8.3-alpine-v3.19-swoole-slim
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - '9501:9501'
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
      - URL_MAPAS=2
      # Passe as variáveis do .env para o container
      - DB_HOST=quota-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=quota-redis
    depends_on:
      - quota-db       
      - quota-redis
    networks:
      - quota-net
      - lab

  quota-db:
    container_name: quota-db
    image: mariadb:latest
    volumes:
      - quota-db:/var/lib/mysql
    ports:
      - '3306:3306'
    environment:
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - quota-net

  quota-redis:
    container_name: quota-redis
    image: redis:latest
    ports:
      - '6379:6379'
    networks:
      - quota-net

volumes:
  quota-db:
    # Development params
#    driver: local
#    driver_opts:
#      o: bind
#      type: none
#      device: ./.docker/quota-db

networks:
  lab:
    name: dev-scripts_lab # Rede que está o container do Mapas
    external: true
  quota-net:
